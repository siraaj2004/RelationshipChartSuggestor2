name: RelationshipAIKeyboard
options:
  bundleIdPrefix: com.shaik
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.8.0"
    CURRENT_PROJECT_VERSION: "9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
configs:
  Debug: debug
  Release: release

# Change these to your own team / identifiers before signing.
# App Group must match in all three entitlements files and SharedStore.appGroupID.
targets:
  RelationshipAIKeyboard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shaik.relationshipaikeyboard
        PRODUCT_NAME: RelationshipAIKeyboard
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: App/RelationshipAIKeyboard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: KeyboardExtension
        embed: true
      - target: BroadcastExtension
        embed: true
    scheme:
      testTargets: [RelationshipAIKeyboardTests]

  KeyboardExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KeyboardExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shaik.relationshipaikeyboard.keyboard
        PRODUCT_NAME: KeyboardExtension
        INFOPLIST_FILE: KeyboardExtension/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: KeyboardExtension/KeyboardExtension.entitlements
    dependencies: []

  BroadcastExtension:
    # A ReplayKit Broadcast Upload Extension is an app-extension product in Xcode;
    # the broadcast point is declared in its Info.plist (NSExtensionPointIdentifier).
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BroadcastExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shaik.relationshipaikeyboard.broadcast
        PRODUCT_NAME: BroadcastExtension
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/BroadcastExtension.entitlements
    dependencies: []

  RelationshipAIKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Shared is NOT compiled in here on purpose: the tests use @testable import
      # of the app target (which already contains Shared). Compiling it twice
      # would create duplicate type definitions and fail the macOS build.
      - path: Tests/UnitTests
    dependencies:
      - target: RelationshipAIKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shaik.relationshipaikeyboard.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  RelationshipAIKeyboard:
    build:
      targets:
        RelationshipAIKeyboard: all
        KeyboardExtension: all
        BroadcastExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [RelationshipAIKeyboardTests]
    archive:
      config: Release
