name: Unsigned IPA for Windows sideloading

# Run this FROM WINDOWS: github.com -> your repo -> Actions -> this workflow -> Run workflow.
# You get a downloadable .ipa artifact. It is unsigned: install it from Windows
# with Sideloadly or AltStore, which sign it with your Apple ID (see WINDOWS_TO_IPHONE.md).
on:
  workflow_dispatch:

jobs:
  unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # XcodeGen (current) emits project format 77, which needs Xcode 16+.
        # Xcode 15.4 cannot open it ("future Xcode project file format (77)").
        # Prefer 16.4: its iOS 18.5 SDK (22F77) matches a simulator runtime that
        # is actually installed on the runner — with 16.2 (SDK 22C146) actool
        # fails with "No simulator runtime version ... available".
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.3.app || sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build device app (unsigned) and package IPA container
        run: bash scripts/package-unsigned-ipa.sh
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelationshipAIKeyboard-unsigned-ipa
          path: build/RelationshipAIKeyboard-unsigned.ipa
          retention-days: 14
