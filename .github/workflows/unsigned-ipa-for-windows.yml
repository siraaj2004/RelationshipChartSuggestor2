name: Unsigned IPA for Windows sideloading

# Run this FROM WINDOWS: github.com -> your repo -> Actions -> this workflow -> Run workflow.
# You get a downloadable .ipa artifact. It is unsigned: install it from Windows
# with Sideloadly or AltStore, which sign it with your Apple ID (see WINDOWS_TO_IPHONE.md).
on:
  workflow_dispatch:

jobs:
  unsigned-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build device app (unsigned) and package IPA container
        run: bash scripts/package-unsigned-ipa.sh
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelationshipAIKeyboard-unsigned-ipa
          path: build/RelationshipAIKeyboard-unsigned.ipa
          retention-days: 14
